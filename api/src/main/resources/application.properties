spring.application.name=api
server.port=8080

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


spring.datasource.url=jdbc:postgresql://localhost:5433/video_processing
spring.datasource.username=postgres
spring.datasource.password=postgres



spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Application Kafka topic
app.kafka.video-processing-topic=video-processing

# Kafka Consumer
spring.kafka.consumer.group-id=video-processing-workers
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.videoprocessing.api.event

aws.s3.bucket=${AWS_S3_BUCKET:video-processing}
aws.s3.region=${AWS_S3_REGION:us-east-1}
aws.s3.endpoint=${AWS_S3_ENDPOINT:http://localhost:9000}
aws.access-key=${AWS_ACCESS_KEY:minioadmin}
aws.secret-key=${AWS_SECRET_KEY:minioadmin}

