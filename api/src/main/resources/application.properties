spring.application.name=video-processing-api
server.port=8080

# -------------------------------------------------------------------
# JPA / Hibernate
# show-sql and format_sql are disabled; they leak schema details and
# degrade production throughput. Enable locally via env or profile.
# -------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# -------------------------------------------------------------------
# Datasource — credentials must be supplied via environment variables
# in production. The local defaults (localhost:5433/postgres) are
# intentionally weak development values only.
# -------------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/video_processing}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

# -------------------------------------------------------------------
# Kafka
# -------------------------------------------------------------------
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Application Kafka topic
app.kafka.video-processing-topic=video-processing

# Kafka Consumer
spring.kafka.consumer.group-id=video-processing-workers
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.videoprocessing.api.event

# -------------------------------------------------------------------
# Object Storage (MinIO / S3)
# Credentials default to the local MinIO dev values only.
# In production, supply real credentials via environment variables.
# -------------------------------------------------------------------
aws.s3.bucket=${AWS_S3_BUCKET:video-processing}
aws.s3.region=${AWS_S3_REGION:us-east-1}
aws.s3.endpoint=${AWS_S3_ENDPOINT:}
# Public-facing endpoint for presigned download URLs (must be reachable
# from the browser — use localhost/public host, not Docker-internal name).
aws.s3.presigned-url-endpoint=${AWS_S3_PRESIGNED_URL_ENDPOINT:}
aws.access-key=${AWS_ACCESS_KEY:minioadmin}
aws.secret-key=${AWS_SECRET_KEY:minioadmin}

# -------------------------------------------------------------------
# Video Processing
# -------------------------------------------------------------------
video.processing.kafka.dlq-topic=video-processing-dlq
video.processing.retry.initial-delay-seconds=5
video.processing.retry.max-delay-seconds=60
video.processing.max-retries=3
video.processing.kafka.concurrency=3

ffmpeg.executable=${FFMPEG_EXECUTABLE:ffmpeg}
ffprobe.executable=${FFPROBE_EXECUTABLE:ffprobe}

# -------------------------------------------------------------------
# Multipart upload limits
# -------------------------------------------------------------------
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# -------------------------------------------------------------------
# Actuator
# Expose only the essential endpoints. show-details=when-authorized
# prevents the full health breakdown from being publicly readable.
# -------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.endpoint.health.show-components=when-authorized
