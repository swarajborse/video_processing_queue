# Render Blueprint — VidFlow (Video Processing Queue)
# https://render.com/docs/blueprint-spec
# Deploy via: Render Dashboard → New → Blueprint → connect this repo
#
# External services required (free, no credit card):
#   Kafka  → Redpanda Serverless  https://cloud.redpanda.com
#   Storage → Supabase Storage (S3-compatible) https://supabase.com

services:

  # ──────────────────────────────────────────
  # 1. Spring Boot API (Docker)
  # ──────────────────────────────────────────
  - type: web
    name: video-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      # Database — individual properties so we can build a jdbc:postgresql:// URL
      - key: DB_HOST
        fromDatabase:
          name: video-postgres
          property: host
      - key: DB_PORT
        fromDatabase:
          name: video-postgres
          property: port
      - key: DB_NAME
        fromDatabase:
          name: video-postgres
          property: database
      - key: DB_USER
        fromDatabase:
          name: video-postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: video-postgres
          property: password

      # Kafka — Redpanda Serverless (SASL_SSL / SCRAM-SHA-256)
      # Get these from: cloud.redpanda.com → your cluster → Connect
      - key: SPRING_KAFKA_BOOTSTRAP_SERVERS
        sync: false   # e.g. seed-xxxx.us-east-1.aws.redpanda.cloud:9092
      - key: KAFKA_SASL_USERNAME
        sync: false
      - key: KAFKA_SASL_PASSWORD
        sync: false

      # Object Storage — Supabase Storage (S3-compatible)
      # Get these from: Supabase Dashboard → Storage → S3 Access
      - key: AWS_S3_ENDPOINT
        sync: false   # https://<project-ref>.storage.supabase.co/storage/v1/s3
      - key: AWS_S3_REGION
        sync: false   # your Supabase project region, e.g. ap-south-1
      - key: AWS_S3_BUCKET
        value: video-processing
      - key: AWS_ACCESS_KEY
        sync: false
      - key: AWS_SECRET_KEY
        sync: false

      - key: SPRING_PROFILES_ACTIVE
        value: prod

  # ──────────────────────────────────────────
  # 2. Spring Boot Worker (Kafka consumer)
  # ──────────────────────────────────────────
  - type: worker
    name: video-worker
    runtime: docker
    dockerfilePath: ./Dockerfile.worker
    dockerContext: .
    plan: free
    envVars:
      # Database — individual properties so we can build a jdbc:postgresql:// URL
      - key: DB_HOST
        fromDatabase:
          name: video-postgres
          property: host
      - key: DB_PORT
        fromDatabase:
          name: video-postgres
          property: port
      - key: DB_NAME
        fromDatabase:
          name: video-postgres
          property: database
      - key: DB_USER
        fromDatabase:
          name: video-postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: video-postgres
          property: password

      - key: SPRING_KAFKA_BOOTSTRAP_SERVERS
        sync: false
      - key: KAFKA_SASL_USERNAME
        sync: false
      - key: KAFKA_SASL_PASSWORD
        sync: false

      - key: AWS_S3_ENDPOINT
        sync: false
      - key: AWS_S3_REGION
        sync: false
      - key: AWS_S3_BUCKET
        value: video-processing
      - key: AWS_ACCESS_KEY
        sync: false
      - key: AWS_SECRET_KEY
        sync: false

      - key: SPRING_PROFILES_ACTIVE
        value: prod

  # ──────────────────────────────────────────
  # 3. React / Vite Frontend (Static Site)
  # ──────────────────────────────────────────
  - type: web
    name: video-frontend
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false   # set to your video-api Render URL
      - key: VITE_GRAFANA_URL
        value: ""

databases:
  - name: video-postgres
    plan: free
    databaseName: video_processing
    user: vidflow
