# -----------------------------------------------------------------------
# Production profile — active when SPRING_PROFILES_ACTIVE=prod
# Used by Render.com deployment
# -----------------------------------------------------------------------

# --- Database: build the JDBC URL from Render's individual DB properties ---
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# --- Kafka: Redpanda Serverless SASL/SCRAM authentication ---
# Connection details from: cloud.redpanda.com → your cluster → Connect
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS}
spring.kafka.properties.security.protocol=SASL_SSL
spring.kafka.properties.sasl.mechanism=SCRAM-SHA-256
spring.kafka.properties.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required username="${KAFKA_SASL_USERNAME}" password="${KAFKA_SASL_PASSWORD}";

# --- Supabase Storage: region must be specified for S3-compatible requests ---
aws.s3.region=${AWS_S3_REGION}
